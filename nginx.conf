server {
    listen 80;
    server_name _;

    location /user/ {
        proxy_pass http://user-service:80/;
    }

    location /products/ {
        proxy_pass http://product-service:80/;
    }

    location /orders/ {
        proxy_pass http://order-service:80/;
    }

    location / {
        default_type text/plain;
        return 200 "Microservices deployment is running. Use /user/, /products/, or /orders/\n";
    }
}
